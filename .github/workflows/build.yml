name: Desktop development build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - name: Cleanup lifecycle tests
        run: make test-cleanup
      - name: Game tests
        run: make test
      - name: Native development package
        run: make package
      - name: Recover and enforce local retention
        if: always()
        run: make clean
      - name: Bounded diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-logs
          path: .build/logs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      # Development packages stay on this disposable runner. No accumulating
      # per-run package uploads, release publishing or release artifact deletion.
